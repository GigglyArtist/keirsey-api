<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Опросник Кейрси</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes card-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    .card-in { animation: card-in 0.25s ease-out; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center p-4">

  <main class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl p-8 space-y-6">
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-slate-800">Опросник Кейрси</h1>
      <p class="text-slate-500">70 вопросов · примерно 10 минут</p>
    </header>

    <!-- Progress bar: пока заглушка -->
    <div class="h-2 w-full rounded-full bg-slate-200 overflow-hidden">
      <div id="progress" class="h-full bg-indigo-500 transition-all duration-300" style="width: 0%"></div>
    </div>
    <p id="counter" class="text-sm text-slate-400 text-right">Вопрос 1 из 70</p>

    <!-- Карточка вопроса -->
    <section id="card" class="space-y-4"></section>
  </main>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
