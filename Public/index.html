<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Опросник Кейрси</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes card-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    .card-in { animation: card-in 0.25s ease-out; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center p-4">

  <main class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl p-8 space-y-6">
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-slate-800">Опросник Кейрси</h1>
      <p class="text-slate-500">70 вопросов · примерно 10 минут</p>
    </header>

    <!-- Progress bar: пока заглушка -->
    <div class="h-2 w-full rounded-full bg-slate-200 overflow-hidden">
      <div id="progress" class="h-full bg-indigo-500 transition-all duration-300" style="width: 0%"></div>
    </div>
    <p id="counter" class="text-sm text-slate-400 text-right">Вопрос 1 из 70</p>

    <!-- Карточка вопроса -->
    <section id="card" class="space-y-4"></section>
    
    <footer class="space-y-1 pt-2 text-center">
      <p class="text-xs text-slate-400">Сервис не собирает персональные данные: ответы не сохраняются на сервере.</p>
      <a href="/privacy.html" class="text-xs text-indigo-400 hover:underline">Политика конфиденциальности</a>
    </footer>
  </main>
  
  <!-- Оверлей полной расшифровки: скрыт по умолчанию -->
  <div id="modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/60">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[80vh] overflow-y-auto p-8 space-y-4">
      <div class="flex items-start justify-between gap-4">
        <h3 id="modal-title" class="text-2xl font-bold text-slate-800"></h3>
        <button id="modal-close" class="text-2xl leading-none text-slate-400 hover:text-slate-600 transition">×</button>
      </div>
      <p id="modal-text" class="leading-relaxed text-slate-600 whitespace-pre-line"></p>
    </div>
  </div>
  
  <script src="questions.js"></script>
  <script src="descriptions.js"></script>
  <script src="app.js"></script>
</body>
</html>
